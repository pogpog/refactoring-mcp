[project]
name = "refactoring-python-mcp"
version = "0.1.0"
description = "MCP server exposing a searchable refactoring/design-pattern knowledge base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",             # FastMCP: added in 1.2.0, renamed MCPServer in 2.0
    "rank-bm25",
    "sentence-transformers",
    "numpy",
]

[project.scripts]
refactoring-python-mcp = "refactoring_python_mcp.server:main"
refactoring-python-mcp-index = "refactoring_python_mcp.indexer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refactoring_python_mcp"]
